<main>
  @if (error) {
    <app-error [message]="error"></app-error>
  } @else {
    @if (country$ | async; as country) {
      @if (country.participations.length === 0) {
        <p class="state-message" role="status">No data available for this country.</p>
      } @else {
        <app-header [title]="headerTitle" [kpis]="headerKpis"></app-header>

        <section class="chart-section" aria-label="Medals per year chart">
          <canvas id="countryChart" role="img" [attr.aria-label]="'Line chart showing medal evolution per year for ' + headerTitle"></canvas>
        </section>

        <nav class="back-nav" aria-label="Page navigation">
          <a routerLink="/">&#8592; Go back</a>
        </nav>
      }
    } @else {
      <div class="spinner" role="status" aria-label="Loading"></div>
    }
  }
</main>
